<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kunal Zee Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f0f2f5}
header{background:#fff;padding:10px;text-align:center;box-shadow:0 2px 8px #0002;position:sticky;top:0}
header img{height:55px}
.top{background:#c40000;color:#fff;text-align:center;padding:8px;font-weight:800}
.wrap{max-width:1000px;margin:15px auto;padding:0 15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:190px;object-fit:cover}
.card div{padding:12px}
footer{background:#111;color:#888;text-align:center;padding:12px;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<header><img src="logo.jpg" alt="Kunal Zee Studio"></header>
<div class="top">KUNAL ZEE STUDIO - OFFICIAL WEBSITE</div>
<div class="wrap">
<div class="card"><img src="news1.jpg"><div><b>झारखंड होमगार्ड 365 दिन रोजगार की मांग</b><br><small>रवि मुखर्जी को जवानों का समर्थन</small></div></div>
<div class="card"><img src="news2.jpg"><div><b>बिहार आंगनबाड़ी मानदेय बढ़ोतरी</b><br><small>सरकार का बड़ा ऐलान</small></div></div>
<div class="card"><img src="news3.jpg"><div><b>दिल्ली DTC कर्मियों की हड़ताल</b><br><small>मांगें पूरी होने तक आंदोलन</small></div></div>
</div>
<footer>© 2024 Kunal ZEE STUDIO | kunal-zee123.github.io</footer>
</body>
